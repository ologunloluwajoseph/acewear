<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE — Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0f; color: #ececf1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px; text-align: center;
  }
  .card {
    max-width: 420px; padding: 40px 32px; border-radius: 24px;
    background: #15151c; border: 1px solid #2a2a35;
  }
  .suit { font-size: 56px; letter-spacing: 8px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin-bottom: 10px; color: #f0b429; }
  p { font-size: 15px; line-height: 1.6; color: #9b9ba7; margin-bottom: 24px; }
  button {
    padding: 12px 28px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #f5c451, #d98e04);
    color: #1a1a22; font-weight: 700; font-size: 15px;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <main class="card">
    <div class="suit">♠ ♥ ♦ ♣</div>
    <h1>You're offline</h1>
    <p>The house is temporarily closed — no connection right now. Cached pages and media are still available. Reconnect to deal back in.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
